{{- /* Uso: {{< figure src="/image/default/x.jpg" title="Legenda" alt="Descrição opcional" >}} */ -}}
{{- $title := .Get "title" -}}
<figure>
    <img src="{{ .Get "src" | relURL }}" alt="{{ .Get "alt" | default $title }}" loading="lazy" />
    {{- with $title }}
    <figcaption>{{ . }}</figcaption>
    {{- end }}
</figure>
