{{ define "stager" }}
<div class="container">
    <div class="stager">
        <main>
            <div class="single-container window-guestbook">
                <div class="content">
                    <h1 class="title">📖 {{ .Title }}</h1>
                    <div class="markdown">{{ .Content }}</div>

                </div>
            </div>
        </main>
    </div>
</div>
{{ end }}
