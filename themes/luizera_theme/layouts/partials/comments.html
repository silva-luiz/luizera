{{- with site.Params.giscus }}
{{- if and .repoId .categoryId }}
<section id="comments" class="comments-window">
    <div class="comments-window-title">COMMENTS.EXE <span>_ □ ×</span></div>
    <div class="comments-window-body">
        <script src="https://giscus.app/client.js"
            data-repo="{{ .repo }}"
            data-repo-id="{{ .repoId }}"
            data-category="{{ .category }}"
            data-category-id="{{ .categoryId }}"
            data-mapping="{{ .mapping | default "pathname" }}"
            data-strict="1"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="{{ .theme | default "light" }}"
            data-lang="{{ .lang | default "pt" }}"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
        </script>
        <noscript>Ative o JavaScript para ver os comentários.</noscript>
    </div>
</section>
{{- end }}
{{- end }}
