<div class="content">

    <!-- Corpo do post -->
    <article>
        <div class="content-header">
            <h1 class="title">{{ .Title }}</h1>
            <p class="meta">
                <span>{{ partial "date.html" .Date }}</span>
                <span>
                    {{ .Params.author | default .Site.Params.author.name }}
                </span>
                <span>{{ partial "reading-time.html" . }}</span>
            </p>
        </div>
        {{- partial "series.html" . }}
        <div class="markdown">{{ .Content }}</div>
    </article>

    <!-- Tags -->
    {{ with .Params.tags }}
    <div class="content-tag">
        <span><i class="bi bi-bookmarks-fill"></i></span>
        {{ range . }}
        <span>
            <a class="item-link" href="{{ printf "tags/%s/" (. | urlize) | relLangURL }}">{{ . }}</a>
        </span>
        {{ end }}
    </div>
    {{ end }}

    {{ partial "comments.html" . }}

</div>
