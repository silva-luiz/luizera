<!-- Scripts -->
{{ $js := resources.Get "js/main.js" | js.Build (dict "targetPath" "js/main.js" "minify" true) | fingerprint }}
<script src="{{ $js.RelPermalink }}" defer></script>
{{ partial "analytics.html" . }}
<!-- eSheep: ovelhinha do Windows 95 andando pela página.
     web-esheep por Adriano Petrucci (GPL-3.0): https://github.com/Adrianotiger/web-esheep
     Animações eSheep 64bit (MIT): https://github.com/Adrianotiger/desktopPet
     Só carrega depois da página pronta (não disputa banda com o conteúdo), e não
     aparece em telas de toque nem para quem pediu menos movimento. -->
<script>
  (function () {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    function startSheep() {
      var s = document.createElement("script");
      s.src = "{{ "vendor/esheep/esheep.js" | relURL }}";
      s.onload = function () {
        new eSheep({ allowPets: "none", allowPopup: "no" }).Start("{{ "vendor/esheep/animations.xml" | relURL }}");
      };
      document.body.appendChild(s);
    }
    function later() {
      if ("requestIdleCallback" in window) requestIdleCallback(startSheep, { timeout: 3000 });
      else setTimeout(startSheep, 1000);
    }
    if (document.readyState === "complete") later();
    else window.addEventListener("load", later);
  })();
</script>
