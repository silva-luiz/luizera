<!-- Scripts -->
{{ $js := resources.Get "js/main.js" | js.Build (dict "targetPath" "js/main.js" "minify" true) }}
<script src="{{ $js.RelPermalink }}" defer></script>
{{ partial "analytics.html" . }}
<!-- eSheep: ovelhinha do Windows 95 andando pela página.
     web-esheep por Adriano Petrucci (GPL-3.0): https://github.com/Adrianotiger/web-esheep
     Animações eSheep 64bit (MIT): https://github.com/Adrianotiger/desktopPet -->
<script src="{{ "vendor/esheep/esheep.js" | relURL }}" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if (typeof eSheep === "undefined") return;
    new eSheep({ allowPets: "none", allowPopup: "no" }).Start("{{ "vendor/esheep/animations.xml" | relURL }}");
  });
</script>
