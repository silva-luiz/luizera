{{ range .Paginator.Pages }}

<section class="item">

    <div class="item-thumbnail">
        {{ with .Resources.Get "tags.jpg" }}
        <img src="{{ .RelPermalink }}" alt="Thumbnail">
        {{ else }}
        {{ with .Params.thumbnail }}
        <img src="{{ . | relURL}}" alt="Thumbnail">
        {{ else }}
        <img src="{{"image/default/tags.jpg" | relURL}}" alt="Thumbnail">
        {{ end }}
        {{ end }}
    </div>

    <div class="item-text">
        <a href="{{.Permalink}}">
            <div class="item-text-title"><b>{{ .Title }}</b></div>
            <div class="item-text-brief">{{ .Summary }}</div>
            <div class="item-text-meta">
                <p>
                    <span>{{.Date.Format "Jan 2, 2006"}}</span>
                    <span>
                        By {{ .Params.author | default .Site.Params.author.name }}
                    </span>
                </p>
            </div>
        </a>
    </div>

</section>


{{ end }}
