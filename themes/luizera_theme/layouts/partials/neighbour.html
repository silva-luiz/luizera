<div class="pagination">

    <div class="pagination-item">
        {{ with .PrevInSection }}
        <a class="left item-link" href="{{.Permalink}}">
            {{ partial "icon.html" "chevron-left" }}
            <span>{{.Title}}</span>
        </a>
        {{ end }}
    </div>

    <div class="pagination-item">
        {{ with .NextInSection }}
        <a class="right item-link" href="{{.Permalink}}">
            {{ partial "icon.html" "chevron-right" }}
            <span>{{.Title}}</span>
        </a>
        {{ end }}
    </div>

</div>
