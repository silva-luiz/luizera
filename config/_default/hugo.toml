baseURL = 'https://luizera.com.br/'
title = 'Luizera´s quotes'
copyright = 'All Rights Reserved'

theme = 'luizera_theme'

defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false
removePathAccents = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[pagination]
  pagerSize = 10

[minify]
  disableCSS = false

[params]
  enableSCSS = true
  [params.author]
    name = "Luiz Henrique"
    description = "Faço uns programas aí. Brinco de barman às vezes, também rabisco e toco música."
    github = "https://github.com/silva-luiz/"

  # Player da sidebar: cole aqui o link de uma playlist/álbum/música do Spotify.
  # Vazio = mostra o widget decorativo.
  [params.player]
    spotify = ""

  # Comentários (https://giscus.app). Só aparecem quando categoryId estiver preenchido.
  [params.giscus]
    repo = "silva-luiz/luizera"
    repoId = "R_kgDOMMmCZg"
    category = "Announcements"
    categoryId = "DIC_kwDOMMmCZs4DK_xZ"
    mapping = "pathname"
    theme = "light"
    lang = "pt"

[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# Renderização do Markdown
[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = false
    noClasses = false

[module]
  [module.hugoVersion]
    extended = true
    min = "0.128.0"
