[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.147.8"
  HUGO_ENV = "production"
  HUGO_ENABLEGITINFO = "true"

# Cache no navegador. As páginas HTML continuam sem cache (o padrão do Netlify),
# então post novo aparece na hora.

# CSS e JS têm um hash no nome que muda a cada alteração: podem ficar em cache para sempre.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens, vídeo do avatar e a ovelha: 1 semana. Se trocar uma imagem mantendo o
# mesmo nome, quem já visitou pode ver a antiga por até 1 semana (use um nome novo).
[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
